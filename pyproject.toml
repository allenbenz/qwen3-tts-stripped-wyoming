[project]
name = "qwen3-tts-stripped-wyoming"
version = "0.1.0"
description = "Wyoming-protocol TTS server for Qwen3-TTS CustomVoice models (bf16 / lite / int8-q8, CUDA or CPU)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "qwen3-tts-stripped-wyoming contributors" }]
requires-python = ">=3.12"
keywords = ["wyoming", "tts", "text-to-speech", "home-assistant", "qwen3-tts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "wyoming>=1.10,<2",
    "numpy>=1.26",
    "huggingface-hub>=0.30",
    # The fast TTS backend. faster-qwen3-tts wraps qwen-tts models with a
    # static-KV-cache + CUDA-graph decode path (real-time RTF, streaming
    # output). It installs `qwen-tts-hf`, a Transformers-5 compatibility build
    # of upstream qwen-tts that provides the SAME `qwen_tts` package -- do not
    # also install upstream `qwen-tts`.
    "faster-qwen3-tts>=0.1",
    "qwen-tts-hf>=0.1",
    # qwen-asr (STT side of the server) still pins transformers==4.57.6 while
    # qwen-tts-hf needs Transformers 5; the override below forces the newer
    # line (qwen-asr's modeling is validated by the e2e suite).
    "qwen-asr>=0.0.6",
    "safetensors>=0.4",
]

[tool.uv]
# qwen-asr==0.0.6 requires transformers==4.57.6 while qwen-tts-hf (the
# transformers-5 build of qwen-tts) requires a 5.x line; the override pins the
# 5.x line everywhere. If the ASR e2e breaks after an upgrade, revisit this.
override-dependencies = ["transformers>=5,<6"]

[project.scripts]
qwen3-tts-stripped-wyoming = "qwen3_tts_stripped_wyoming.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen3_tts_stripped_wyoming"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests against a real model directory (enable with QWEN3TTS_E2E=1)",
    "docker: tests that build and run the docker image (enable with QWEN3TTS_DOCKER_E2E=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "wyoming.*",
    "qwen_tts.*",
    "qwen_asr.*",
    "faster_qwen3_tts.*",
    "transformers.*",
    "torch.*",
    "torch.nn.*",
    "safetensors.*",
    "huggingface_hub.*",
    "numpy",
]
ignore_missing_imports = true
